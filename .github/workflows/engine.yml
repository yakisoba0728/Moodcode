name: Engine headless

on:
  pull_request:
    paths:
      - "packages/contracts/**"
      - "packages/engine/**"
      - "packages/windows-job/**"
      - "apps/engine-harness/**"
      - "scripts/test-engine.mjs"
      - "scripts/evaluate-engine.mjs"
      - "scripts/verify-engine-resilience*.mjs"
      - "scripts/verify-engine-persistent-soak*.mjs"
      - "scripts/verify-pty-repeatability*.mjs"
      - "scripts/benchmark-engine.mjs"
      - "scripts/inspect-engine-db-contract*.mjs"
      - "scripts/inspect-history-storage-cost*"
      - "scripts/compare-history-storage-cost*"
      - "docs/moodcode/next-db-contract-baseline.json"
      - "scripts/prepare-pty.mjs"
      - "scripts/verify-media-account*.mjs"
      - "scripts/verify-provider-coverage*.mjs"
      - "scripts/plan-media-verification*.mjs"
      - "package*.json"
      - "tsconfig*.json"
      - ".github/**"
      - "docs/moodcode/engine-ci.md"
  push:
    paths:
      - "packages/contracts/**"
      - "packages/engine/**"
      - "packages/windows-job/**"
      - "apps/engine-harness/**"
      - "scripts/test-engine.mjs"
      - "scripts/evaluate-engine.mjs"
      - "scripts/verify-engine-resilience*.mjs"
      - "scripts/verify-engine-persistent-soak*.mjs"
      - "scripts/verify-pty-repeatability*.mjs"
      - "scripts/benchmark-engine.mjs"
      - "scripts/inspect-engine-db-contract*.mjs"
      - "scripts/inspect-history-storage-cost*"
      - "scripts/compare-history-storage-cost*"
      - "docs/moodcode/next-db-contract-baseline.json"
      - "scripts/prepare-pty.mjs"
      - "scripts/verify-media-account*.mjs"
      - "scripts/verify-provider-coverage*.mjs"
      - "scripts/plan-media-verification*.mjs"
      - "package*.json"
      - "tsconfig*.json"
      - ".github/**"
      - "docs/moodcode/engine-ci.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Installing workspace dev dependencies must not download or launch Electron.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  CI: "true"

jobs:
  posix:
    name: Headless ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ["24.x", "26.x"]
    env:
      MOODCODE_CI_LANE: posix-full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Record environment and planned scope
        run: node .github/scripts/engine-ci.mjs metadata
      - name: Install locked dependencies including optional PTY
        id: install
        shell: bash
        run: |
          set -o pipefail
          npm ci --include=optional 2>&1 | tee artifacts/engine-ci/install.log
      - name: Prepare and require the native POSIX PTY capability
        run: node .github/scripts/engine-ci.mjs prepare-pty
      - name: Validate the headless CI launcher
        run: node --test .github/scripts/engine-ci.test.mjs
      - name: Typecheck contracts, engine and harness
        run: node .github/scripts/engine-ci.mjs typecheck
      - name: Build only headless projects
        run: node .github/scripts/engine-ci.mjs build
      - name: Preserve the primary SQL database contract
        run: node .github/scripts/engine-ci.mjs db-contract
      - name: Validate bounded history measurement and exact storage comparison
        run: node --test scripts/inspect-history-storage-cost.test.mjs scripts/compare-history-storage-cost.test.mjs
      - name: Run local media CLI regression fixtures
        run: node .github/scripts/engine-ci.mjs test-media-local
      - name: Validate resilience CLI preflight and report failures
        run: node .github/scripts/engine-ci.mjs test-hardening-cli
      - name: Run complete headless fixtures
        run: node .github/scripts/engine-ci.mjs test
      - name: Run scripted local engine evaluation
        run: node .github/scripts/engine-ci.mjs eval
      - name: Verify mixed execution, cancellation and restart
        run: node .github/scripts/engine-ci.mjs resilience
      - name: Verify persistent Engine history and crash quarantine
        run: node .github/scripts/engine-ci.mjs persistent-soak
      - name: Repeat native PTY lifecycle and retained fault diagnostics
        run: node .github/scripts/engine-ci.mjs pty-repeatability
      - name: Measure native engine performance baseline
        run: node .github/scripts/engine-ci.mjs benchmark
      - name: Record outcome summary
        if: always()
        env:
          MOODCODE_CI_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          MOODCODE_CI_JOB_STATUS: ${{ job.status }}
        run: node .github/scripts/engine-ci.mjs summary
      - name: Upload results and failure logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: engine-${{ matrix.os }}-node-${{ matrix.node }}-attempt-${{ github.run_attempt }}
          path: artifacts/engine-ci/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  windows-portable:
    name: Portable contracts/storage only / Windows / Node ${{ matrix.node }}
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["24.x", "26.x"]
    env:
      MOODCODE_CI_LANE: windows-portable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Record partial Windows scope
        run: node .github/scripts/engine-ci.mjs metadata
      - name: Install locked dependencies
        id: install
        shell: pwsh
        run: |
          npm ci --include=optional *>&1 | Tee-Object -FilePath artifacts/engine-ci/install.log
          exit $LASTEXITCODE
      - name: Record PTY helper preparation without claiming Windows native support
        run: node .github/scripts/engine-ci.mjs prepare-pty
      - name: Validate the headless CI launcher
        run: node --test .github/scripts/engine-ci.test.mjs
      - name: Typecheck contracts, engine and harness source
        run: node .github/scripts/engine-ci.mjs typecheck
      - name: Build only headless projects
        run: node .github/scripts/engine-ci.mjs build
      - name: Preserve the primary SQL database contract
        run: node .github/scripts/engine-ci.mjs db-contract
      - name: Run portable contracts and selected SQLite/native-port fixtures
        run: node .github/scripts/engine-ci.mjs test-windows
      - name: Record partial outcome summary
        if: always()
        env:
          MOODCODE_CI_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          MOODCODE_CI_JOB_STATUS: ${{ job.status }}
        run: node .github/scripts/engine-ci.mjs summary
      - name: Upload partial results and failure logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: engine-windows-portable-node-${{ matrix.node }}-attempt-${{ github.run_attempt }}
          path: artifacts/engine-ci/
          retention-days: 14
          if-no-files-found: warn
