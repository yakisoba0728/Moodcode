name: Desktop packages

on:
  push:
    paths: ['apps/desktop/**', 'packages/engine/**', 'packages/contracts/**', 'packages/windows-job/**', 'scripts/*desktop*', 'package*.json', '.github/workflows/desktop-*']
  pull_request:
    paths: ['apps/desktop/**', 'packages/engine/**', 'packages/contracts/**', 'packages/windows-job/**', 'scripts/*desktop*', 'package*.json', '.github/workflows/desktop-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Unsigned bundle and native smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.x'
          cache: npm
      - run: npm ci --include=optional
      - run: node scripts/prepare-pty.mjs
      - run: npm run build:desktop
      - name: Native account, update, MCP and evidence regression
        run: >-
          node --import ./node_modules/tsx/dist/loader.mjs --test
          apps/desktop/src/main/host.test.ts apps/desktop/src/main/next-stage-recovery-host.test.ts
          apps/desktop/src/main/accounts.test.ts apps/desktop/src/main/updates.test.ts
          apps/desktop/src/main/settings.test.ts apps/desktop/src/worker/anthropic-config.test.ts
          apps/desktop/src/preload/api.test.ts apps/desktop/src/renderer/fixtures/anthropic-cleanup.test.mjs
          apps/desktop/src/worker/advanced-mcp.test.ts apps/desktop/src/worker/runtime.test.ts
          apps/desktop/src/worker/credential-broker.test.ts
          scripts/desktop-release-policy.test.mjs scripts/desktop-native-package.test.mjs
          scripts/desktop-test-evidence.test.mjs scripts/desktop-main-utility-close.test.mjs
          scripts/verify-desktop-codex-renewal-live.test.mjs
      # The Engine never falls back to a direct child on Windows, so the account
      # coding test's run_command needs the Job Object addon built for this Node.
      # It is removed again so later Electron steps keep their original native state.
      - name: Windows Node Job Object for local account coding regression
        if: runner.os == 'Windows'
        run: node packages/windows-job/scripts/build.mjs
      - name: Local HTTP app-account coding regression
        run: node --test scripts/desktop-codex-account-verification.test.mjs
      - name: Remove Windows Node Job Object before Electron utility steps
        if: runner.os == 'Windows'
        run: node -e "require('node:fs').rmSync('packages/windows-job/build',{recursive:true,force:true})"
      - name: Linux original utility close, exit and fault boundaries
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/verify-desktop-main-utility-close.mjs
      - name: macOS/Windows original utility close, exit and fault boundaries
        if: runner.os != 'Linux'
        run: node scripts/verify-desktop-main-utility-close.mjs
      - name: macOS actual advanced GUI flows
        if: runner.os == 'macOS'
        run: node scripts/test-desktop-advanced.mjs
      - name: Linux original utility Codex credential refresh and cancellation
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/test-desktop-codex-refresh.mjs
      - name: macOS/Windows original utility Codex credential refresh and cancellation
        if: runner.os != 'Linux'
        run: node scripts/test-desktop-codex-refresh.mjs
      - name: macOS actual delayed renderer delivery and restore theme
        if: runner.os == 'macOS'
        run: |
          node -e "require('node:fs').mkdirSync('artifacts/renderer-delivery', { recursive: true })"
          node apps/desktop/src/renderer/fixtures/verify-delivery.mjs artifacts/renderer-delivery/verification.json
      - name: macOS Anthropic settings, native tools, reconnect and cancellation
        if: runner.os == 'macOS'
        run: node apps/desktop/src/renderer/fixtures/verify-anthropic.mjs artifacts/anthropic-desktop/verification.json
      - name: macOS actual PTY failure and native evidence retention
        if: runner.os == 'macOS'
        run: node scripts/verify-desktop-advanced-evidence.mjs
      - name: Package this OS without publishing
        run: node scripts/package-desktop.mjs --no-build
      - name: Linux portable bundle, utility, SQLite and renderer smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/test-desktop-package.mjs --portable
      - name: macOS/Windows portable bundle, utility, SQLite and renderer smoke
        if: runner.os != 'Linux'
        run: node scripts/test-desktop-package.mjs --portable
      - name: Linux real command and PTY supervisor smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/test-desktop-package.mjs
      - name: macOS real command and PTY supervisor smoke
        if: runner.os == 'macOS'
        run: node scripts/test-desktop-package.mjs
      - name: Windows actual packaged utility Job Object command and approval gate
        if: runner.os == 'Windows'
        run: node scripts/test-desktop-package.mjs
      - name: Linux real updater checksum, disposable install and recovery fixture
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/test-desktop-update.mjs
      - name: macOS real updater checksum, disposable install and recovery fixture
        if: runner.os == 'macOS'
        run: node scripts/test-desktop-update.mjs
      - name: Upload unsigned reviewable package and logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: desktop-unsigned-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            release/
            artifacts/desktop-next/
            artifacts/desktop-advanced/
            artifacts/desktop-package/
            artifacts/renderer-delivery/
            artifacts/anthropic-desktop/
            artifacts/renderer-anthropic/
            artifacts/next-main-utility-close/
            artifacts/engine-account-lsp-20261010/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
